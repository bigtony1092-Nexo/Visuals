<title>ARiA Ion Panels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: instrument console — fixed evidence rail at left, panels stacked right, in familiarity order. */
:root{
  color-scheme: dark;
  --bg:#0d1013; --surface:#141a1f; --surface-2:#1a2228; --surface-3:#212b32;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#e8edf1; --fg-2:#9aa8b2; --fg-3:#6b7a85;
  --accent:#3987e5;
  --ion-b:#3987e5; --ion-y:#e66767; --ion-none:#6b7a85;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-other:#8a97a1;
  --good:#199e70; --warn:#c98500; --crit:#e66767;
  --seq-1:#14364a; --seq-2:#1c5cab; --seq-3:#2a78d6; --seq-4:#5598e7; --seq-5:#9ec5f4;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#fcfcfb; --surface:#ffffff; --surface-2:#f4f5f3; --surface-3:#eceee9;
    --line:rgba(0,0,0,.11); --line-2:rgba(0,0,0,.2);
    --fg:#0b0b0b; --fg-2:#52514e; --fg-3:#7b7a76;
    --accent:#2a78d6;
    --ion-b:#2a78d6; --ion-y:#e34948; --ion-none:#7b7a76;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-other:#6e6d69;
    --good:#1baf7a; --warn:#eda100; --crit:#e34948;
    --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#1c5cab; --seq-5:#0d366b;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#fcfcfb; --surface:#ffffff; --surface-2:#f4f5f3; --surface-3:#eceee9;
  --line:rgba(0,0,0,.11); --line-2:rgba(0,0,0,.2);
  --fg:#0b0b0b; --fg-2:#52514e; --fg-3:#7b7a76;
  --accent:#2a78d6;
  --ion-b:#2a78d6; --ion-y:#e34948; --ion-none:#7b7a76;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-other:#6e6d69;
  --good:#1baf7a; --warn:#eda100; --crit:#e34948;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#1c5cab; --seq-5:#0d366b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse}

/* ---------- header ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.bar .spacer{flex:1}
.badge{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:3px;
  border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.badge.demo{border-color:var(--warn);color:var(--warn)}
.btn{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 11px;
  border:1px solid var(--line-2);border-radius:3px;color:var(--fg-2)}
.btn:hover{color:var(--fg);border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#061016;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
.rail{background:var(--bg);padding-block:0;overflow-y:auto;min-width:0}
.main{background:var(--bg);min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .shell{display:flex;flex-direction:column}
  .rail{max-height:none}
  .main{order:-1}
}

/* ---------- rail ---------- */
.sh{display:flex;align-items:center;gap:8px;padding:13px 16px 7px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--fg-3)}
.sh::after{content:'';flex:1;height:1px;background:var(--line)}
.rail-note{padding:0 16px 10px;font-size:11.5px;color:var(--fg-3)}
.ionbtn{display:grid;grid-template-columns:7px 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 16px;border-left:2px solid transparent}
.ionbtn:hover{background:var(--surface-2)}
.ionbtn.sel{background:var(--surface-2);border-left-color:var(--accent)}
.ionbtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.ionbtn .seq{font-family:var(--font-mono);font-size:11.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ionbtn.sel .seq{font-weight:600}
.ionbtn .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);white-space:nowrap}
.tierchip{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;padding:1px 5px;border-radius:2px;
  border:1px solid var(--line-2);color:var(--fg-3)}
.tierchip.ok{border-color:var(--good);color:var(--good)}
.tierchip.weak{border-color:var(--warn);color:var(--warn)}

/* ---------- panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.phead .spacer{flex:1}
.fam{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  border:1px solid var(--line-2);color:var(--fg-3)}
.fam.conventional{border-color:var(--accent);color:var(--accent)}
.stat{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;padding:2px 6px;border-radius:2px;font-weight:600}
.stat.render{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.stat.partial{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.stat.blank{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.pbody{padding:12px 14px 4px;min-width:0}
.pfoot{padding:8px 14px 12px;font-size:11.5px;color:var(--fg-3);line-height:1.5}
.pfoot b{color:var(--fg-2);font-weight:500}
.readout{display:flex;gap:16px;flex-wrap:wrap;padding:0 14px 10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.readout b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.empty{padding:22px 14px;font-size:12.5px;color:var(--fg-3);line-height:1.6}
.empty b{color:var(--warn);font-weight:500}
.chartwrap{position:relative;width:100%;min-width:0;overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:600px;height:auto;overflow:visible}
.chartwrap canvas{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:2px 14px 10px;font-size:11.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;z-index:9;background:var(--surface-3);border:1px solid var(--line-2);
  border-radius:4px;padding:6px 8px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg);
  line-height:1.5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tip .k{color:var(--fg-3)}
.dtable{width:100%;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.dtable th{text-align:left;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);
  font-weight:600;padding:5px 9px;border-bottom:1px solid var(--line)}
.dtable td{padding:4px 9px;border-bottom:1px solid var(--line);color:var(--fg-2)}
.tscroll{overflow-x:auto;max-height:320px;overflow-y:auto}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<header class="bar">
  <h1>ARiA Ion Panels</h1>
  <span class="badge" id="srcBadge">—</span>
  <span class="badge demo" id="demoBadge" hidden>demo export</span>
  <span class="badge" id="decBadge" hidden></span>
  <div class="spacer"></div>
  <button class="btn" id="loadBtn">Load export</button>
  <input type="file" id="fileIn" multiple accept=".json,.jsonl,.txt" class="vis-hidden" aria-label="Export files">
</header>

<div class="shell" id="shell">
  <aside class="rail">
    <div class="sh">Ions</div>
    <div class="rail-note" id="ionCount">—</div>
    <div id="ionList"></div>
    <div class="sh">Proteins</div>
    <div id="protList"></div>
    <div class="rail-note" id="loadHint" style="padding-top:10px">
      Drop an export folder's <code>manifest.json</code>, <code>ions.jsonl</code>,
      <code>spectra.jsonl</code>, <code>traces.jsonl</code> and <code>proteins.jsonl</code>
      anywhere on this page, or use Load export.
    </div>
  </aside>
  <main class="main" id="panels"></main>
</div>

<script>
(function(){
'use strict';

/* ==================================================================
   1. Chemistry — monoisotopic residue masses, used for the demo export
   ================================================================== */
var AA={G:57.02146,A:71.03711,S:87.03203,P:97.05276,V:99.06841,T:101.04768,C:103.00919,
        L:113.08406,I:113.08406,N:114.04293,D:115.02694,Q:128.05858,K:128.09496,E:129.04259,
        M:131.04049,H:137.05891,F:147.06841,R:156.10111,Y:163.06333,W:186.07931};
var HYD={W:11,F:10.5,L:9.6,I:8.4,M:5.8,V:5,Y:4,C:2.6,P:1.5,A:.8,T:.4,H:-1.3,G:0,S:-.8,
         Q:-2,N:-2,E:-3.1,D:-3.6,K:-5.1,R:-4.5};
var H2O=18.010565, PROTON=1.0072765, NEUTRON=1.0033548;

function pepMass(s){var m=H2O;for(var i=0;i<s.length;i++)m+=AA[s.charAt(i)]||0;return m;}
function hydIdx(s){var v=0;for(var i=0;i<s.length;i++)v+=HYD[s.charAt(i)]||0;return v/Math.pow(s.length,.62);}
function hash32(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0;}return h>>>0;}
function rng(seed){var s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function fmt(v,d){return v==null?'—':Number(v).toFixed(d==null?2:d);}
function fmtInt(v){return v==null?'—':Number(v).toLocaleString();}

function fragments(seq){
  var n=seq.length,out=[],s=0,i;
  for(i=0;i<n-1;i++){s+=AA[seq.charAt(i)];out.push({ion:'b',idx:i+1,mz:s+PROTON});}
  s=H2O;
  for(i=n-1;i>0;i--){s+=AA[seq.charAt(i)];out.push({ion:'y',idx:n-i,mz:s+PROTON});}
  return out;
}

/* ==================================================================
   2. Demo export — contract-shaped records
   Real peptide sequences and the published Amherst Top3 percentiles;
   spectra, retention times and SeqStart positions are synthetic.
   ================================================================== */
var DEMO_PEPTIDES=[
  {acc:'Q99836',prot:'MYD88_HUMAN',seq:'FITVCDYTNPCTK',       maxInt:19.539, start:171},
  {acc:'Q99836',prot:'MYD88_HUMAN',seq:'DVLPGTCVWSIASELIEK',  maxInt:1.289,  start:86},
  {acc:'Q99836',prot:'MYD88_HUMAN',seq:'LGRDDVLLELGPSIEEDCQK',maxInt:0.800,  start:40},
  {acc:'Q99836',prot:'MYD88_HUMAN',seq:'ECDFQTK',             maxInt:0.751,  start:231},
  {acc:'Q99836',prot:'MYD88_HUMAN',seq:'DDVLLELGPSIEEDCQK',   maxInt:0.622,  start:43},
  {acc:'P04406',prot:'G3P_HUMAN',  seq:'GALQNIIPASTGAAK',     maxInt:14.802, start:195},
  {acc:'P04406',prot:'G3P_HUMAN',  seq:'LISWYDNEFGYSNR',      maxInt:6.411,  start:311},
  {acc:'P04406',prot:'G3P_HUMAN',  seq:'VPTANVSVVDLTCR',      maxInt:0.843,  start:234},
  {acc:'P04406',prot:'G3P_HUMAN',  seq:'AAVLDLTCR',           maxInt:0.519,  start:122}
];
var DEMO_SAMPLES=[
  {sample_id:'CH163',vendor:'Bruker',acquisition_method:'diaPASEF',drift_kind:'ion_mobility',has_ims:true,
   search_engine:'DIA-NN',batch:'amherst-A',sample_class:'HeLa',role:'target',n_proteins:3418,total_signal:1.82e10},
  {sample_id:'CH164',vendor:'Bruker',acquisition_method:'diaPASEF',drift_kind:'ion_mobility',has_ims:true,
   search_engine:'DIA-NN',batch:'amherst-A',sample_class:'HeLa',role:'target',n_proteins:3664,total_signal:1.61e10},
  {sample_id:'CH165',vendor:'Bruker',acquisition_method:'diaPASEF',drift_kind:'ion_mobility',has_ims:true,
   search_engine:'DIA-NN',batch:'amherst-A',sample_class:'HeLa',role:'target',n_proteins:3512,total_signal:1.74e10}
];
/* published percentiles, Amherst cohort */
var DEMO_PCT={'Q99836':{CH163:65,CH164:94,CH165:35},'P04406':{CH163:8,CH164:44,CH165:93}};
var DEMO_TOP3={'Q99836':{CH163:5.918,CH164:7.209,CH165:4.402},'P04406':{CH163:3.104,CH164:7.352,CH165:9.871}};

function chargeFor(seq,r){
  var n=seq.length;
  if(n<=8) return 2;
  if(n<=13) return r()<.3?3:2;
  if(n<=17) return r()<.55?3:2;
  return 3;
}

function buildLibrary(seq){
  var n=seq.length, lib=fragments(seq), r=rng(hash32(seq+'|lib')), i,f,mid,v,mx=0;
  for(i=0;i<lib.length;i++){
    f=lib[i];
    v = f.ion==='y' ? .52+.48*r() : .20+.42*r();
    mid = 1-Math.abs(f.idx/(n-1)-.5)*1.15;
    v *= .30+.90*mid;
    if(f.ion==='y' && seq.charAt(n-f.idx)==='P') v*=1.9;
    if(f.ion==='b' && seq.charAt(f.idx)==='P') v*=1.6;
    f.int=v; f.label=f.ion+f.idx;
  }
  for(i=0;i<lib.length;i++) mx=Math.max(mx,lib[i].int);
  for(i=0;i<lib.length;i++) lib[i].int=100*lib[i].int/mx;
  lib.sort(function(a,b){return a.mz-b.mz;});
  return lib;
}

function buildExperimental(seq,z,lib){
  var r=rng(hash32(seq+'|'+z+'|exp')), exp=[], i, span=0, mx=0;
  for(i=0;i<lib.length;i++) span=Math.max(span,lib[i].mz);
  for(i=0;i<lib.length;i++){
    var f=lib[i], keep=(r()>.14 || f.int>45);
    if(!keep) continue;
    exp.push({ion:f.ion,idx:f.idx,label:f.label,mz:f.mz*(1+(r()*2-1)*4e-6),
              int:f.int*(.58+.84*r()),ppm:(r()*2-1)*5.2});
  }
  for(i=0;i<12;i++) exp.push({ion:null,idx:null,label:null,
    mz:130+(span+40-170)*r(), int:1.1+6.5*r()*r(), ppm:null});
  for(i=0;i<exp.length;i++) mx=Math.max(mx,exp[i].int);
  for(i=0;i<exp.length;i++) exp[i].int=100*exp[i].int/mx;
  exp.sort(function(a,b){return a.mz-b.mz;});
  /* normalised dot product on sqrt intensities */
  var byLabel={},num=0,da=0,db=0,matched=0;
  for(i=0;i<exp.length;i++) if(exp[i].label) byLabel[exp[i].label]=exp[i];
  for(i=0;i<lib.length;i++){
    var e=byLabel[lib[i].label], a=Math.sqrt(lib[i].int), b=e?Math.sqrt(e.int):0;
    num+=a*b; da+=a*a; if(e&&e.int>2.5) matched++;
  }
  for(i=0;i<exp.length;i++) db+=exp[i].int;
  return {peaks:exp, dot:clamp(num/Math.sqrt(da*db),.4,.995), matched:matched};
}

function isotopePeaks(mz,z,mass){
  var lam=4.9e-4*mass, w=[1,lam,lam*lam/2], out=[], i;
  for(i=0;i<3;i++) out.push({mz:mz+i*NEUTRON/z, int:100*w[i]/w[0], exp:100*w[i]/w[0], idx:i});
  return out;
}

function buildDemo(){
  var ions=[], spectra=[], traces=[], proteins=[], uid=0;
  DEMO_SAMPLES.forEach(function(smp,si){
    DEMO_PEPTIDES.forEach(function(p){
      var r=rng(hash32(p.seq+'|'+smp.sample_id));
      var z=chargeFor(p.seq,r), mass=pepMass(p.seq), mz=(mass+z*PROTON)/z;
      var rt=3.1+31.5*clamp((hydIdx(p.seq)+6)/18,0,1)+(r()-.5)*1.1;
      var scale=[0.82,1,0.74][si];
      var inten=p.maxInt*scale*(.85+.3*r());
      var id=('0000000'+(hash32(p.seq+smp.sample_id).toString(16))).slice(-8)+('0000000'+(hash32(smp.sample_id+p.seq+z).toString(16))).slice(-8);
      var lib=buildLibrary(p.seq), ex=buildExperimental(p.seq,z,lib);
      var ppmList=ex.peaks.filter(function(q){return q.ppm!=null;}).map(function(q){return Math.abs(q.ppm);});
      var medPpm=ppmList.sort(function(a,b){return a-b;})[Math.floor(ppmList.length/2)]||null;
      ions.push({
        ion_uid:id, sample_id:smp.sample_id,
        coord:{mz:mz, rt_min:rt, charge:z, drift:0.78+0.00042*mz+(r()-.5)*.03,
               drift_kind:'ion_mobility', one_over_k0:0.78+0.00042*mz, ccs:null},
        intensity:{matched_intensity:inten, summed_precursor_intensity:inten*1980*(.6+.8*r()),
                   cluster_rank:1, n_consecutive_scans:3+Math.floor(r()*6)},
        annotation:{peptide_sequence:p.seq, prot_accession:p.acc, protein_name:p.prot,
                    seq_start:p.start, mods:null, frag_type:'by'},
        confidence:{tier:'pass2_confirmed', decoy_controlled:true, ppm_error:medPpm,
                    score:ex.dot, score_kind:'dotproduct_sqrt'},
        provenance:{source_file:'DEMO/'+smp.sample_id+'.d', vendor:smp.vendor,
                    acquisition_method:smp.acquisition_method, has_ims:true,
                    search_engine:smp.search_engine, batch:smp.batch, sample_class:smp.sample_class},
        lineage:{parent_ion_uids:[],cluster_uid:'cl-'+id.slice(0,6),atlas_uid:'atl-'+p.acc+'-'+p.start+'-z'+z},
        events:[
          {stage:'detected',at:'2026-10-13T14:02:11Z',tool:'RunConvert',tool_version:'2.1.0',params_hash:'a19f',
           coord_snapshot:{mz:mz*(1+2.4e-6),rt_min:rt+.014,drift:null},note:null},
          {stage:'z1_filtered',at:'2026-10-13T14:02:19Z',tool:'RunFilter',tool_version:'2.1.0',params_hash:'77be',coord_snapshot:null,note:'retained, z='+z},
          {stage:'selected',at:'2026-10-13T14:11:02Z',tool:'pass2_targeting',tool_version:'3.0.1',params_hash:'c4d2',coord_snapshot:null,note:'target '+p.acc},
          {stage:'identified',at:'2026-10-13T14:19:48Z',tool:'DIA-NN',tool_version:'1.9.1',params_hash:'8e05',coord_snapshot:null,note:'q<0.01'},
          {stage:'annotated',at:'2026-10-13T14:22:03Z',tool:'match_targets_spatial_in_cube',tool_version:'2026-10-02',
           params_hash:'b771',coord_snapshot:{mz:mz,rt_min:rt,drift:null},note:'RT recalibrated'},
          {stage:'clustered',at:'2026-10-13T14:41:55Z',tool:'MergeNCluster',tool_version:'2.1.0',params_hash:'d003',coord_snapshot:null,note:'cluster_rank 1'}
        ]
      });
      spectra.push({ion_uid:id,sample_id:smp.sample_id,kind:'ms2_experimental',precursor_mz:mz,charge:z,
        scan_id:smp.sample_id+':ms2',collision_energy:32,peaks:ex.peaks.map(function(q){
          return {mz:q.mz,intensity:q.int,ion:q.label,idx:q.idx,charge:1,ppm_error:q.ppm};}),
        match:{dot_product:ex.dot,basis:'sqrt_intensity',matched:ex.matched,n_matched:ex.matched,
               n_library:lib.length,library_source:'DEMO atlas'}});
      spectra.push({ion_uid:id,sample_id:null,kind:'ms2_library',precursor_mz:mz,charge:z,scan_id:null,
        collision_energy:32,peaks:lib.map(function(q){

var CSS=getComputedStyle(document.documentElement);
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function niceTicks(lo,hi,n){
  if(!(hi>lo)) return [lo];
  var span=hi-lo, step=Math.pow(10,Math.floor(Math.log10(span/n)));
  var err=span/n/step;
  if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
  var out=[],v=Math.ceil(lo/step)*step;
  for(;v<=hi+step*1e-6;v+=step) out.push(+v.toFixed(10));
  return out;
}
function logTicks(lo,hi){
  var out=[], e=Math.floor(Math.log10(lo)), top=Math.ceil(Math.log10(hi));
  for(;e<=top;e++) out.push(Math.pow(10,e));
  return out.filter(function(v){return v>=lo*0.95&&v<=hi*1.05;});
}
function sciLabel(v){
  if(v===0) return '0';
  var e=Math.round(Math.log10(v));
  if(e>=-1&&e<=3) return String(+v.toFixed(e<0?2:(e<1?1:0)));
  return '1e'+e;
}
var SERIES=['--s1','--s2','--s3'];
function sampleColors(ids){
  /* fixed order, capped at 3 — past three, fold to Other (all-pairs CVD gate) */
  var map={},i;
  for(i=0;i<ids.length;i++) map[ids[i]] = i<3 ? tok(SERIES[i]) : tok('--s-other');
  return map;
}

function mkTip(wrap){
  var tip=document.createElement('div');
  tip.className='tip'; tip.hidden=true; wrap.appendChild(tip);
  return {
    show:function(html,x,y){
      tip.innerHTML=html; tip.hidden=false;
      var w=wrap.clientWidth, tw=tip.offsetWidth, th=tip.offsetHeight;
      tip.style.left=clamp(x+12,4,Math.max(4,w-tw-4))+'px';
      tip.style.top=Math.max(4,y-th-10)+'px';
    },
    hide:function(){tip.hidden=true;}
  };
}
function attachSvgTips(wrap){
  var tip=mkTip(wrap);
  wrap.addEventListener('mousemove',function(ev){
    var t=ev.target.closest('[data-tip]');
    if(!t){tip.hide();return;}
    var r=wrap.getBoundingClientRect();
    tip.show(t.getAttribute('data-tip'),ev.clientX-r.left,ev.clientY-r.top);

    var W=wrap.clientWidth||760, dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
    var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    var pts=cfg.points;
    if(!pts.length) return;
    var xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
    var xlo=cfg.xlo!=null?cfg.xlo:Math.min.apply(null,xs), xhi=cfg.xhi!=null?cfg.xhi:Math.max.apply(null,xs);
    if(xhi===xlo){xhi=xlo+1;}
    var ylo,yhi;
    if(cfg.logY){
      var pos=ys.filter(function(v){return v>0;});
      ylo=Math.pow(10,Math.floor(Math.log10(Math.min.apply(null,pos))));
      yhi=Math.pow(10,Math.ceil(Math.log10(Math.max.apply(null,pos))));
    } else if(cfg.yZero===false){
      var mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
      var padY=(mx-mn)*0.08||Math.abs(mn||1)*0.05;
      ylo=mn-padY; yhi=mx+padY;
    } else { ylo=0; yhi=Math.max.apply(null,ys)*1.1; }
    var xpad=(xhi-xlo)*0.05;
    var X=function(v){return pad.l+(v-(xlo-xpad))/((xhi+xpad)-(xlo-xpad))*(W-pad.l-pad.r);};
    var Y=cfg.logY
      ? function(v){return (H-pad.b)-(Math.log10(v)-Math.log10(ylo))/(Math.log10(yhi)-Math.log10(ylo))*((H-pad.b)-pad.t);}
      : function(v){return (H-pad.b)-(v-ylo)/(yhi-ylo)*((H-pad.b)-pad.t);};
    var grid=tok('--line'), ink=tok('--fg-3'), mono='9.5px '+tok('--font-mono');
    g.strokeStyle=grid; g.lineWidth=1; g.font=mono; g.fillStyle=ink;
    var yt=cfg.logY?logTicks(ylo,yhi):niceTicks(ylo,yhi,4);
    yt.forEach(function(t){
      var py=Math.round(Y(t))+.5;
      g.beginPath(); g.moveTo(pad.l,py); g.lineTo(W-pad.r,py); g.stroke();
      g.textAlign='right'; g.textBaseline='middle';
      g.fillText(cfg.yFmt?cfg.yFmt(t):sciLabel(t),pad.l-8,py);
    });
    niceTicks(xlo,xhi,6).forEach(function(t){
      var px=Math.round(X(t))+.5;
      g.beginPath(); g.moveTo(px,pad.t); g.lineTo(px,H-pad.b); g.stroke();
      g.textAlign='center'; g.textBaseline='top';
      g.fillText(cfg.xFmt?cfg.xFmt(t):String(Math.round(t)),px,H-pad.b+8);
    });
    g.strokeStyle=tok('--line-2');
    g.beginPath(); g.moveTo(pad.l,H-pad.b+.5); g.lineTo(W-pad.r,H-pad.b+.5); g.stroke();
    g.textAlign='center'; g.fillStyle=ink;
    g.fillText(cfg.xLabel,(pad.l+W-pad.r)/2,H-14);
    g.save(); g.translate(14,(pad.t+H-pad.b)/2); g.rotate(-Math.PI/2);
    g.textBaseline='middle'; g.fillText(cfg.yLabel,0,0); g.restore();
    /* marks: 2px surface ring keeps overlapping points separable */
    screenPts=[];
    var ring=tok('--surface');
    pts.forEach(function(p){
      if(cfg.logY&&!(p.y>0)) return;
      var px=X(p.x), py=Y(p.y);
      g.beginPath(); g.arc(px,py,5,0,6.2832);
      g.fillStyle=p.color; g.globalAlpha=.92; g.fill(); g.globalAlpha=1;
      g.lineWidth=2; g.strokeStyle=ring; g.stroke();
      screenPts.push({px:px,py:py,p:p});
    });
  }
  paint();
  var ro=window.ResizeObserver?new ResizeObserver(paint):null;
  if(ro) ro.observe(wrap); else window.addEventListener('resize',paint);
  cv.addEventListener('mousemove',function(ev){
    var r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    var best=null,bd=1e9,i,d;
    for(i=0;i<screenPts.length;i++){
      d=Math.pow(screenPts[i].px-mx,2)+Math.pow(screenPts[i].py-my,2);
      if(d<bd){bd=d;best=screenPts[i];}
    }
    if(best&&bd<=196) tip.show(best.p.tip,best.px,best.py); else tip.hide();
  });
  cv.addEventListener('mouseleave',function(){tip.hide();});
}

/* ---------- shared: which samples carry real mobility ---------- */
function driftSamples(){
  var ok={},bad=[];
  state.data.manifest.samples.forEach(function(s){
    if(s.drift_kind==='ion_mobility') ok[s.sample_id]=1;
    else bad.push(s);
  });
  return {ok:ok,bad:bad};
}
function driftGate(){
  var d=driftSamples(), nOk=Object.keys(d.ok).length;
  function why(s){
    return s.drift_kind==='quad_window'
      ? s.sample_id+' ('+s.acquisition_method+'): quadrupole window position, not mobility'
      : s.sample_id+' ('+s.acquisition_method+'): no drift column in the raw file';
  }
  if(!nOk) return ['BLANK','no sample has real ion mobility — '+d.bad.map(why).join('; ')];
  if(d.bad.length) return ['PARTIAL','excludes '+d.bad.map(why).join('; ')];
  return ['RENDER',''];
}
function driftIons(){
  var ok=driftSamples().ok;
  return state.data.ions.filter(function(i){
    return ok[i.sample_id] && i.coord && i.coord.drift_kind==='ion_mobility' && i.coord.drift!=null;
  });
}

/* ---------- shared: binned density on canvas ---------- */
function densityPanel(body,cfg){
  var wrap=document.createElement('div'); wrap.className='chartwrap';
  var cv=document.createElement('canvas'); wrap.appendChild(cv); body.appendChild(wrap);
  var tip=mkTip(wrap);
  var H=cfg.height||430, pad={l:66,r:16,t:16,b:44}, NBX=cfg.bins||34, NBY=NBX;
  var grid=null, xlo,xhi,ylo,yhi, cw,ch, maxN=0;
  function paint(){
    var W=wrap.clientWidth||760, dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
    var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    var pts=cfg.points; if(!pts.length) return;
    xlo=Math.min.apply(null,pts.map(function(p){return p.x;}));
    xhi=Math.max.apply(null,pts.map(function(p){return p.x;}));
    ylo=Math.min.apply(null,pts.map(function(p){return p.y;}));
    yhi=Math.max.apply(null,pts.map(function(p){return p.y;}));
    if(xhi===xlo) xhi=xlo+1; if(yhi===ylo) yhi=ylo+1;
    /* square cells: bin the y axis to match the x cell size, so the map is a map */
    var plotW=W-pad.l-pad.r, plotH=H-pad.t-pad.b;
    cw=plotW/NBX; NBY=Math.max(6,Math.round(plotH/cw)); ch=plotH/NBY;
    grid=[]; maxN=0;
    pts.forEach(function(p){
      var bx=clamp(Math.floor((p.x-xlo)/(xhi-xlo)*NBX),0,NBX-1);
      var by=clamp(Math.floor((p.y-ylo)/(yhi-ylo)*NBY),0,NBY-1);
      var k=by*NBX+bx; grid[k]=(grid[k]||0)+1;
      if(grid[k]>maxN) maxN=grid[k];
    });
    var ramp=[tok('--seq-1'),tok('--seq-2'),tok('--seq-3'),tok('--seq-4'),tok('--seq-5')];
    for(var k=0;k<NBX*NBY;k++){
      var n=grid[k]; if(!n) continue;
      var f=maxN>1?Math.log(1+n)/Math.log(1+maxN):1;
      var ci=clamp(Math.floor(f*ramp.length),0,ramp.length-1);
      var bx=k%NBX, by=(k/NBX)|0;
      g.fillStyle=ramp[ci];
      /* 1px gap keeps adjacent cells separable */
      g.fillRect(pad.l+bx*cw, (H-pad.b)-(by+1)*ch, Math.max(1,cw-1), Math.max(1,ch-1));
    }
    var ink=tok('--fg-3'), line=tok('--line-2'); g.font='9.5px '+tok('--font-mono');
    g.strokeStyle=line; g.lineWidth=1;
    g.beginPath(); g.moveTo(pad.l,H-pad.b+.5); g.lineTo(W-pad.r,H-pad.b+.5); g.stroke();
    g.fillStyle=ink; g.textAlign='center'; g.textBaseline='top';
    niceTicks(xlo,xhi,6).forEach(function(t){
      var px=pad.l+(t-xlo)/(xhi-xlo)*(W-pad.l-pad.r);
      g.fillText(cfg.xFmt?cfg.xFmt(t):sciLabel(t),px,H-pad.b+8);
    });
    g.textAlign='right'; g.textBaseline='middle';
    niceTicks(ylo,yhi,5).forEach(function(t){
      var py=(H-pad.b)-(t-ylo)/(yhi-ylo)*(H-pad.t-pad.b);
      g.fillText(cfg.yFmt?cfg.yFmt(t):sciLabel(t),pad.l-8,py);
    });
    g.textAlign='center'; g.fillText(cfg.xLabel,(pad.l+W-pad.r)/2,H-14);
    g.save(); g.translate(16,(pad.t+H-pad.b)/2); g.rotate(-Math.PI/2);
    g.textBaseline='middle'; g.fillText(cfg.yLabel,0,0); g.restore();
  }
  paint();
  var ro=window.ResizeObserver?new ResizeObserver(paint):null;
  if(ro) ro.observe(wrap); else window.addEventListener('resize',paint);
  cv.addEventListener('mousemove',function(ev){
    if(!grid) return;
    var r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    var bx=Math.floor((mx-pad.l)/cw), by=Math.floor(((H-pad.b)-my)/ch);
    if(bx<0||by<0||bx>=NBX||by>=NBY){tip.hide();return;}
    var n=grid[by*NBX+bx];
    if(!n){tip.hide();return;}
    var x0=xlo+(xhi-xlo)*bx/NBX, x1=xlo+(xhi-xlo)*(bx+1)/NBX;
    var y0=ylo+(yhi-ylo)*by/NBY, y1=ylo+(yhi-ylo)*(by+1)/NBY;
    tip.show('<span class=k>'+esc(cfg.xLabel)+'</span> '+fmt(x0,2)+'–'+fmt(x1,2)+
             '<br><span class=k>'+esc(cfg.yLabel)+'</span> '+fmt(y0,3)+'–'+fmt(y1,3)+
             '<br><span class=k>ions</span> '+fmtInt(n),mx,my);
  });
  cv.addEventListener('mouseleave',function(){tip.hide();});
  return function(){return maxN;};
}

/* ---------- P9: stoichiometry ---------- */
var P_STOICH={
  id:'stoichiometry', title:'Protein stoichiometry ratios', familiarity:'bridge',
  gate:function(){
    if(!tables().proteins) return ['BLANK','this export has no proteins.jsonl'];
    var accs={}; state.data.proteins.forEach(function(p){accs[p.prot_accession]=1;});
    var n=Object.keys(accs).length;
    if(n<2) return ['BLANK','needs at least 2 proteins in the same run, export has '+n];
    var num=state.protein||Object.keys(accs)[0];
    var thin=state.data.proteins.filter(function(p){return p.n_peptides_used<2;}).length;
    if(thin) return ['PARTIAL',thin+' of '+state.data.proteins.length+
      ' quant records rest on a single peptide; those ratios are not the same measurement as a 3-peptide one'];
    return ['RENDER',''];
  },
  draw:function(body){
    var samples=state.data.manifest.samples.map(function(s){return s.sample_id;});
    var by={};
    state.data.proteins.forEach(function(p){
      (by[p.prot_accession]=by[p.prot_accession]||{name:p.protein_name,rows:{}}).rows[p.sample_id]=p;
    });
    var accs=Object.keys(by);
    var num=state.protein&&by[state.protein]?state.protein:accs[0];
    var dens=accs.filter(function(a){return a!==num;}).slice(0,3);
    var W=760,H=280,L=66,R=104,T=20,B=48;
    var x=function(i){return L+(samples.length===1?0.5:i/(samples.length-1))*(W-L-R);};
    var vals=[];
    dens.forEach(function(d){
      samples.forEach(function(sid){
        var a=by[num].rows[sid], b=by[d].rows[sid];
        if(a&&b&&b.top3avg>0) vals.push(a.top3avg/b.top3avg);
      });
    });
    var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    var flo=Math.pow(10,Math.floor(Math.log10(Math.min(lo,1)))), fhi=Math.pow(10,Math.ceil(Math.log10(Math.max(hi,1))));
    var y=function(v){return (H-B)-(Math.log10(v)-Math.log10(flo))/(Math.log10(fhi)-Math.log10(flo))*((H-B)-T);};
    var grid=tok('--line'), ink=tok('--fg-3');
    var out=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Protein stoichiometry ratios">'];
    for(var e=Math.log10(flo);e<=Math.log10(fhi)+1e-9;e++){
      var v=Math.pow(10,e);
      out.push('<line x1="'+L+'" y1="'+fmt(y(v),1)+'" x2="'+(W-R)+'" y2="'+fmt(y(v),1)+'" stroke="'+grid+'" stroke-width="1"/>');
      out.push('<text x="'+(L-8)+'" y="'+fmt(y(v)+3,1)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
        '" font-size="9.5" text-anchor="end">'+sciLabel(v)+'</text>');
    }
    /* parity line: equal amounts */
    if(1>=flo&&1<=fhi){
      out.push('<line x1="'+L+'" y1="'+fmt(y(1),1)+'" x2="'+(W-R)+'" y2="'+fmt(y(1),1)+
        '" stroke="'+tok('--line-2')+'" stroke-width="1" stroke-dasharray="4,4"/>');
      out.push('<text x="'+(W-R-4)+'" y="'+fmt(y(1)-6,1)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
        '" font-size="9" text-anchor="end">equal</text>');
    }
    var rows=[];
    dens.forEach(function(d,di){
      var c=tok(SERIES[di]), path=[], last=null;
      samples.forEach(function(sid,i){
        var a=by[num].rows[sid], b=by[d].rows[sid];
        if(!a||!b||!(b.top3avg>0)) return;
        var r=a.top3avg/b.top3avg;
        path.push((path.length?'L':'M')+fmt(x(i),1)+' '+fmt(y(r),1));
        last={i:i,r:r};
        out.push('<circle cx="'+fmt(x(i),1)+'" cy="'+fmt(y(r),1)+'" r="5" fill="'+c+'" stroke="'+tok('--surface')+
          '" stroke-width="2" data-tip="<span class=k>'+esc(sid)+'</span> '+esc(num)+' / '+esc(d)+
          '<br><span class=k>ratio</span> '+fmt(r,3)+
          '<br><span class=k>'+esc(num)+'</span> '+fmt(a.top3avg,3)+' ('+a.n_peptides_used+' pep)'+
          '<br><span class=k>'+esc(d)+'</span> '+fmt(b.top3avg,3)+' ('+b.n_peptides_used+' pep)"/>');
        rows.push([sid,num,d,fmt(r,3),a.n_peptides_used+' / '+b.n_peptides_used]);
      });
      if(path.length>1) out.push('<path d="'+path.join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2"/>');
      if(last) out.push('<text x="'+fmt(x(last.i)+11,1)+'" y="'+fmt(y(last.r)+3.5,1)+'" fill="'+c+
        '" font-family="'+tok('--font-mono')+'" font-size="10.5" font-weight="600">/ '+
        esc((by[d].name||d).replace('_HUMAN',''))+'</text>');
    });
    out.push('<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="'+tok('--line-2')+'" stroke-width="1"/>');
    samples.forEach(function(sid,i){
      out.push('<text x="'+fmt(x(i),1)+'" y="'+(H-B+18)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
        '" font-size="9.5" text-anchor="middle">'+esc(sid)+'</text>');
    });
    out.push('<text x="'+((L+W-R)/2)+'" y="'+(H-8)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
      '" font-size="9.5" text-anchor="middle">sample</text>');
    out.push('</svg>');
    body.innerHTML='<div class="chartwrap">'+out.join('')+'</div>';
    attachSvgTips(body.firstChild);
    return {
      readout:[['numerator',esc((by[num].name||num))],['denominators',dens.length],['basis','Top3avg, same run only']],
      legend:dens.map(function(d,i){return [SERIES[i],(by[num].name||num)+' / '+(by[d].name||d)];}),
      foot:'Ratios are computed within one run only \u2014 a cross-run ratio mixes biology with loading. Peptide counts on both sides are in the hover: a 1-peptide against a 3-peptide Top3avg is not the same measurement. Pick a different numerator from the protein list.',
      cols:['sample','numerator','denominator','ratio','peptides used'],
      rows:rows
    };
  }
};

/* ---------- P10: flux across runs ---------- */
var P_FLUX={
  id:'flux', title:'Flux across runs', familiarity:'bridge',
  gate:function(){
    if(!tables().proteins) return ['BLANK','this export has no proteins.jsonl'];
    if(state.data.manifest.samples.length<2) return ['BLANK','needs at least 2 samples'];
    var withNorm=state.data.proteins.filter(function(p){
      return p.normalized && (p.normalized.median_scaled!=null || p.normalized.within_protein_max!=null);});
    if(withNorm.length) return ['RENDER',''];
    /* fall back to viewer-side median scaling only when there are enough proteins for a median to mean anything */
    var perSample={};
    state.data.proteins.forEach(function(p){ (perSample[p.sample_id]=perSample[p.sample_id]||[]).push(p); });
    var smallest=Math.min.apply(null,Object.keys(perSample).map(function(k){return perSample[k].length;}));
    if(smallest<5) return ['BLANK','no normalized values in this export, and viewer-side median scaling needs more proteins per sample than this export carries (smallest sample has '+smallest+'). Raw Top3avg across runs mixes biology with loading, so this panel will not draw it'];
    return ['PARTIAL','no normalized values in the export — median scaling computed in the viewer from Top3avg'];
  },
  draw:function(body){
    var samples=state.data.manifest.samples.map(function(s){return s.sample_id;});
    var perSample={};
    state.data.proteins.forEach(function(p){ (perSample[p.sample_id]=perSample[p.sample_id]||[]).push(p); });
    var med={};
    samples.forEach(function(sid){
      var v=(perSample[sid]||[]).map(function(p){return p.top3avg;}).sort(function(a,b){return a-b;});
      med[sid]=v.length?v[Math.floor(v.length/2)]:1;
    });
    var by={},usedStored=false;
    state.data.proteins.forEach(function(p){
      var e=(by[p.prot_accession]=by[p.prot_accession]||{name:p.protein_name,rows:{}});
      var v=(p.normalized&&p.normalized.median_scaled!=null)?p.normalized.median_scaled:(p.top3avg/(med[p.sample_id]||1));
      if(p.normalized&&p.normalized.median_scaled!=null) usedStored=true;
      e.rows[p.sample_id]={v:v,p:p};
    });
    var accs=Object.keys(by).slice(0,3);
    var vals=[]; accs.forEach(function(a){samples.forEach(function(sid){var r=by[a].rows[sid]; if(r) vals.push(r.v);});});
    var W=760,H=280,L=66,R=104,T=20,B=48;
    var x=function(i){return L+(samples.length===1?0.5:i/(samples.length-1))*(W-L-R);};
    var hi=Math.max.apply(null,vals)*1.1, lo=0;
    var y=function(v){return (H-B)-(v-lo)/(hi-lo)*((H-B)-T);};
    var grid=tok('--line'), ink=tok('--fg-3');
    var out=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Flux across runs">'];
    niceTicks(lo,hi,4).forEach(function(t){
      out.push('<line x1="'+L+'" y1="'+fmt(y(t),1)+'" x2="'+(W-R)+'" y2="'+fmt(y(t),1)+'" stroke="'+grid+'" stroke-width="1"/>');
      out.push('<text x="'+(L-8)+'" y="'+fmt(y(t)+3,1)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
        '" font-size="9.5" text-anchor="end">'+sciLabel(t)+'</text>');
    });
    var rows=[];
    accs.forEach(function(a,ai){
      var c=tok(SERIES[ai]), path=[], last=null;
      samples.forEach(function(sid,i){
        var r=by[a].rows[sid]; if(!r) return;
        path.push((path.length?'L':'M')+fmt(x(i),1)+' '+fmt(y(r.v),1));
        last={i:i,v:r.v};
        out.push('<circle cx="'+fmt(x(i),1)+'" cy="'+fmt(y(r.v),1)+'" r="5" fill="'+c+'" stroke="'+tok('--surface')+
          '" stroke-width="2" data-tip="<span class=k>'+esc(sid)+'</span> '+esc(by[a].name||a)+
          '<br><span class=k>median-scaled</span> '+fmt(r.v,3)+
          '<br><span class=k>Top3avg</span> '+fmt(r.p.top3avg,3)+
          '<br><span class=k>peptides used</span> '+r.p.n_peptides_used+'"/>');
        rows.push([sid,a,fmt(r.v,3),fmt(r.p.top3avg,3),r.p.n_peptides_used]);
      });
      if(path.length>1) out.push('<path d="'+path.join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2"/>');
      if(last) out.push('<text x="'+fmt(x(last.i)+11,1)+'" y="'+fmt(y(last.v)+3.5,1)+'" fill="'+c+
        '" font-family="'+tok('--font-mono')+'" font-size="10.5" font-weight="600">'+
        esc((by[a].name||a).replace('_HUMAN',''))+'</text>');
    });
    out.push('<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="'+tok('--line-2')+'" stroke-width="1"/>');
    samples.forEach(function(sid,i){
      out.push('<text x="'+fmt(x(i),1)+'" y="'+(H-B+18)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
        '" font-size="9.5" text-anchor="middle">'+esc(sid)+'</text>');
    });
    out.push('<text x="'+((L+W-R)/2)+'" y="'+(H-8)+'" fill="'+ink+'" font-family="'+tok('--font-mono')+
      '" font-size="9.5" text-anchor="middle">sample</text>');
    out.push('</svg>');
    body.innerHTML='<div class="chartwrap">'+out.join('')+'</div>';
    attachSvgTips(body.firstChild);
    return {
      readout:[['normalization',usedStored?'median_scaled (from the export)':'median_scaled (computed here)'],
               ['proteins',accs.length],['samples',samples.length]],
      legend:accs.map(function(a,i){return [SERIES[i],(by[a].name||a)];}),
      foot:'Median-scaled, so a run that simply had more on column does not read as a change in the protein. A flux that survives this is a candidate; one that disappears was loading.',
      cols:['sample','accession','median-scaled','Top3avg','peptides used'],
      rows:rows
    };
  }
};

var PANELS=[P_MIRROR,P_ISO,P_XIC,P_INT_RT,P_SEQ,P_TOP3,P_DRIFT_RT,P_MZ_DRIFT,P_STOICH,P_FLUX];

/* ==================================================================
   5. Shell rendering
   ================================================================== */
var elPanels=document.getElementById('panels');
var tableOpen={};

function renderPanels(){
  elPanels.innerHTML='';
  PANELS.forEach(function(def){
    var g; try{ g=def.gate(); }catch(e){ g=['BLANK','gate error: '+e.message]; }
    var status=g[0], reason=g[1];
    var panel=document.createElement('section'); panel.className='panel';
    var head=document.createElement('div'); head.className='phead';
    head.innerHTML='<h2>'+esc(def.title)+'</h2>'+
      '<span class="fam '+def.familiarity+'">'+def.familiarity+'</span>'+
      '<span class="stat '+status.toLowerCase()+'">'+status+'</span><div class="spacer"></div>';
    panel.appendChild(head);
    var body=document.createElement('div'); body.className='pbody';
    panel.appendChild(body);
    if(status==='BLANK'){
      body.className='empty';
      body.innerHTML='<b>Blank:</b> '+esc(reason)+'.<br>The panel stays here rather than disappearing, '+
        'so a missing measurement is not mistaken for a zero.';
      elPanels.appendChild(panel);
      return;
    }
    var out;
    try{ out=def.draw(body); }
    catch(e){
      body.className='empty';
      body.innerHTML='<b>Could not draw:</b> '+esc(e.message);
      elPanels.appendChild(panel); return;
    }
    if(out.readout&&out.readout.length){
      var ro=document.createElement('div'); ro.className='readout';
      ro.innerHTML=out.readout.map(function(p){return '<span>'+esc(p[0])+' <b>'+p[1]+'</b></span>';}).join('');
      panel.appendChild(ro);
    }
    if(out.legend&&out.legend.length){
      var lg=document.createElement('div'); lg.className='legend';
      lg.innerHTML=out.legend.map(function(p){
        return '<span><i style="background:'+tok(p[0])+'"></i>'+esc(p[1])+'</span>';}).join('');
      panel.appendChild(lg);
    }
    var foot=document.createElement('div'); foot.className='pfoot';
    foot.innerHTML=(status==='PARTIAL'&&reason?'<b>Partial:</b> '+esc(reason)+'. ':'')+(out.foot||'');
    panel.appendChild(foot);
    if(out.rows&&out.rows.length){
      var btn=document.createElement('button');
      btn.className='btn'+(tableOpen[def.id]?' on':'');
      btn.textContent=tableOpen[def.id]?'Hide values':'Values';
      btn.setAttribute('aria-expanded',tableOpen[def.id]?'true':'false');
      head.appendChild(btn);
      var tw=document.createElement('div'); tw.className='tscroll'; tw.hidden=!tableOpen[def.id];
      tw.innerHTML='<table class="dtable"><thead><tr>'+
        out.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
        out.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+
        '</tbody></table>';
      panel.appendChild(tw);
      btn.addEventListener('click',function(){
        tableOpen[def.id]=!tableOpen[def.id];
        tw.hidden=!tableOpen[def.id];
        btn.classList.toggle('on',tableOpen[def.id]);
        btn.textContent=tableOpen[def.id]?'Hide values':'Values';
        btn.setAttribute('aria-expanded',tableOpen[def.id]?'true':'false');
      });
    }
    elPanels.appendChild(panel);
  });
}

function renderRail(){
  var ids=state.data.manifest.samples.map(function(s){return s.sample_id;});
  var cmap=sampleColors(ids);
  var list=document.getElementById('ionList');
  var ions=state.data.ions.slice().sort(function(a,b){
    var an=(a.annotation&&a.annotation.peptide_sequence)||'zzz', bn=(b.annotation&&b.annotation.peptide_sequence)||'zzz';
    return an===bn ? a.sample_id.localeCompare(b.sample_id) : an.localeCompare(bn);
  }).slice(0,200);
  list.innerHTML='';
  ions.forEach(function(i){
    var b=document.createElement('button');
    b.className='ionbtn'+(state.ion&&state.ion.ion_uid===i.ion_uid?' sel':'');
    b.style.color=cmap[i.sample_id]||tok('--s-other');
    var weak=TIER_ORDER[i.confidence.tier]<TIER_ORDER.pass2_confirmed;
    b.innerHTML='<span class="dot"></span>'+
      '<span class="seq">'+esc((i.annotation&&i.annotation.peptide_sequence)||'unassigned')+'</span>'+
      '<span class="meta">'+esc(i.sample_id)+' '+i.coord.charge+'+</span>';
    b.title=(i.annotation?i.annotation.protein_name||i.annotation.prot_accession:'unassigned')+
      ' · m/z '+fmt(i.coord.mz,4)+' · '+i.confidence.tier;
    b.addEventListener('click',function(){
      state.ion=i;
      if(i.annotation) state.protein=i.annotation.prot_accession;
      renderRail(); renderPanels();
    });
    list.appendChild(b);
  });
  document.getElementById('ionCount').textContent=
    fmtInt(state.data.ions.length)+' ions'+(state.data.ions.length>200?' — first 200 listed':'');

  var protEl=document.getElementById('protList'), seen={}, order=[];
  state.data.ions.forEach(function(i){
    if(!i.annotation) return;
    var a=i.annotation.prot_accession;
    if(!seen[a]){seen[a]={name:i.annotation.protein_name||a,n:0};order.push(a);}
    seen[a].n++;
  });
  protEl.innerHTML='';
  order.forEach(function(a){
    var b=document.createElement('button');
    b.className='ionbtn'+(state.protein===a?' sel':'');
    b.style.color=tok('--fg-2');
    b.innerHTML='<span class="dot" style="background:transparent"></span>'+
      '<span class="seq">'+esc(seen[a].name)+'</span><span class="meta">'+seen[a].n+'</span>';
    b.addEventListener('click',function(){
      state.protein=(state.protein===a?null:a); renderRail(); renderPanels();
    });
    protEl.appendChild(b);
  });
}

function renderHeader(){
  var m=state.data.manifest;
  document.getElementById('srcBadge').textContent=m.export_id+' · '+m.samples.length+' samples';
  document.getElementById('demoBadge').hidden=!m._demo;

function setData(d){
  state.data=d;
  state.ion=d.ions.find(function(i){return i.annotation;})||d.ions[0]||null;
  state.protein=state.ion&&state.ion.annotation?state.ion.annotation.prot_accession:null;
  renderHeader(); renderRail(); renderPanels();
}

/* ==================================================================
   6. Loading a real export
   ================================================================== */
function parseJsonl(txt){
  var out=[],lines=txt.split(/\r?\n/),i;
  for(i=0;i<lines.length;i++){
    var t=lines[i].trim(); if(!t) continue;
    try{ out.push(JSON.parse(t)); }catch(e){ /* skip a bad line rather than lose the file */ }
  }
  return out;
}
function ingest(files){
  var next={manifest:null,ions:[],spectra:[],traces:[],proteins:[]}, pending=files.length, touched=[];
  if(!pending) return;
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var n=f.name.toLowerCase(), txt=String(r.result);
      try{
        if(n.indexOf('manifest')>=0){ next.manifest=JSON.parse(txt); touched.push('manifest'); }
        else if(n.indexOf('ion')>=0){ next.ions=parseJsonl(txt); touched.push('ions'); }
        else if(n.indexOf('spectra')>=0||n.indexOf('spectrum')>=0){ next.spectra=parseJsonl(txt); touched.push('spectra'); }
        else if(n.indexOf('trace')>=0){ next.traces=parseJsonl(txt); touched.push('traces'); }
        else if(n.indexOf('protein')>=0){ next.proteins=parseJsonl(txt); touched.push('proteins'); }
      }catch(e){}
      if(--pending===0) finish();
    };
    r.onerror=function(){ if(--pending===0) finish(); };
    r.readAsText(f);
  });
  function finish(){
    if(!next.ions.length){
      document.getElementById('loadHint').innerHTML=
        '<b style="color:var(--crit)">No ions read.</b> The loader needs a file whose name contains '+
        '<code>ions</code>, one JSON object per line.';
      return;
    }
    if(!next.manifest){
      /* infer a minimal manifest so panels can still gate honestly */
      var bySample={};
      next.ions.forEach(function(i){
        if(!bySample[i.sample_id]) bySample[i.sample_id]={
          sample_id:i.sample_id,
          vendor:(i.provenance&&i.provenance.vendor)||'unknown',
          acquisition_method:(i.provenance&&i.provenance.acquisition_method)||'unknown',
          drift_kind:(i.coord&&i.coord.drift_kind)||'absent',
          has_ims:!!(i.provenance&&i.provenance.has_ims),
          batch:(i.provenance&&i.provenance.batch)||null,
          sample_class:(i.provenance&&i.provenance.sample_class)||null};
      });
      var ks={};
      next.spectra.forEach(function(s){ks[s.kind]=1;});
      next.manifest={export_id:'(no manifest)',created_at:null,method_id:null,
        samples:Object.keys(bySample).map(function(k){return bySample[k];}),
        tables:{ions:true,proteins:next.proteins.length>0,spectra:next.spectra.length>0,
                traces:next.traces.length>0,spectrum_kinds:Object.keys(ks)},
        quant:{metric:'top3avg',absolute_standard_declared:false},
        counts:{ions_total:next.ions.length,ions_exported:next.ions.length,by_tier:{}},
        decimation:null,
        warnings:['No manifest.json was loaded, so sample metadata was inferred from the ion records. Panel gating is only as good as that inference.']};
    } else if(!next.manifest.tables){
      var kk={}; next.spectra.forEach(function(s){kk[s.kind]=1;});
      next.manifest.tables={ions:true,proteins:next.proteins.length>0,spectra:next.spectra.length>0,
        traces:next.traces.length>0,spectrum_kinds:Object.keys(kk)};
    }
    tableOpen={};
    setData(next);
  }
}
document.getElementById('loadBtn').addEventListener('click',function(){
  document.getElementById('fileIn').click();
});
document.getElementById('fileIn').addEventListener('change',function(ev){
  ingest(Array.prototype.slice.call(ev.target.files||[]));
});
['dragenter','dragover'].forEach(function(t){
  document.addEventListener(t,function(e){e.preventDefault();document.body.style.outline='2px dashed '+tok('--accent');});
});
['dragleave','drop'].forEach(function(t){
  document.addEventListener(t,function(e){e.preventDefault();document.body.style.outline='none';});
});
document.addEventListener('drop',function(e){
  var dt=e.dataTransfer; if(!dt) return;
  ingest(Array.prototype.slice.call(dt.files||[]));
});

setData(buildDemo());
window.addEventListener('resize',function(){ /* canvas panels observe their own wrapper */ });
